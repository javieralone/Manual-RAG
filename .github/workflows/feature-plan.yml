name: Feature Plan

on:
  workflow_dispatch:
    inputs:
      feature:
        description: "Número o slug de la feature del roadmap"
        required: false
        type: string
      issue:
        description: "Número del Issue existente que contiene la feature"
        required: false
        type: string
      mode:
        description: "Operación solicitada"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - implement

permissions:
  contents: read
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate implementation plan
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE: ${{ inputs.feature }}
          ISSUE: ${{ inputs.issue }}
        run: |
          if [ -n "$ISSUE" ]; then
            gh issue view "$ISSUE" --json title,body --template '{{.title}}\n\n{{.body}}' > feature-from-issue.md
            python scripts/resolve-feature.py --source feature-from-issue.md --output implementation-plan.md
          elif [ -n "$FEATURE" ]; then
            python scripts/resolve-feature.py "$FEATURE" --output implementation-plan.md
          else
            echo "Debes indicar feature o issue." >&2
            exit 1
          fi

      - name: Upload implementation plan
        uses: actions/upload-artifact@v4
        with:
          name: feature-${{ inputs.issue || inputs.feature }}-plan
          path: implementation-plan.md

      - name: Publish plan on existing Issue
        if: inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          gh label create copilot-implementation --color 1f6feb --description "Issue preparada para Copilot Cloud Agent" --force
          {
            echo "## Plan generado por CI"
            echo "El plan se generó a partir del título y cuerpo de este Issue."
            echo
            echo "## Instrucciones para Copilot Cloud Agent"
            echo "Lee este plan, inspecciona la arquitectura y los tests existentes, implementa el cambio de forma incremental, agrega tests focalizados y abre un Pull Request contra dev. No hagas merge directo."
            echo
            echo "## Plan de implementación"
            cat implementation-plan.md
          } > plan-comment.md
          gh issue comment "$ISSUE" --body-file plan-comment.md
          gh issue edit "$ISSUE" --add-label copilot-implementation