name: RAG Evaluation

on:
  push:
    branches:
      - main
      - master
      - dev
      - feature/*
    paths:
      - "services/retrieval-python/**"
      - ".github/workflows/rag-evaluation.yml"
  pull_request:
    paths:
      - "services/retrieval-python/**"
      - ".github/workflows/rag-evaluation.yml"

jobs:
  golden-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evaluation dependencies
        run: python -m pip install --upgrade pip pydantic prometheus-client

      - name: Run golden dataset evaluation
        working-directory: services/retrieval-python
        run: >-
          python scripts/evaluate_rag.py
          --dataset eval/golden_dataset.json
          --thresholds eval/ci_thresholds.json
          --fixture eval/ci_fixture.json
          --skip-generation
          --output ../../data/artifacts/evaluations/ci-eval-report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: data/artifacts/evaluations/ci-eval-report.json