global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-go
    metrics_path: /metrics
    static_configs:
      - targets: [api-go:8080]
  - job_name: rag-engine
    metrics_path: /metrics
    static_configs:
      - targets: [rag-engine:8000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
