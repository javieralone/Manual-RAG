services:
  # 1. Base de datos vectorial
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # 2. Microservicio Motor RAG (Python)
  rag-engine:
    build:
      context: ./rag-engine
      dockerfile: Dockerfile
    container_name: rag_engine
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/app/.cache/huggingface  # Redirige la caché de HuggingFace
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OMP_NUM_THREADS=2      # Limita hilos de CPU para no saturar los 4 núcleos
      - MKL_NUM_THREADS=2
    volumes:
      - huggingface_cache:/app/.cache/huggingface  # Guarda el modelo en el volumen
      - ./documents:/app/documents
      - ./output:/app/output
    deploy:
      resources:
        limits:
          memory: 2.5g
    depends_on:
      - qdrant
    restart: unless-stopped

  # 2b. Servidor MCP para GitHub Copilot / clientes MCP
  mcp-server:
    build:
      context: ./rag-engine
      dockerfile: Dockerfile
    container_name: rag_mcp_server
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "8001:8001"
    environment:
      - HF_HOME=/app/.cache/huggingface
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MCP_PORT=8001
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    volumes:
      - huggingface_cache:/app/.cache/huggingface
      - ./documents:/app/documents
      - ./output:/app/output
    deploy:
      resources:
        limits:
          memory: 2.5g
    depends_on:
      - qdrant
    restart: unless-stopped

  # 3. API Gateway en Go
  api-go:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    container_name: rag_go_api
    ports:
      - "8080:8080"
    environment:
      - PYTHON_ENGINE_URL=http://rag-engine:8000
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
      - AUTH_REFRESH_SECRET=${AUTH_REFRESH_SECRET:?AUTH_REFRESH_SECRET must be set}
      - AUTH_ISSUER=${AUTH_ISSUER:-manual-rag-api}
      - AUTH_AUDIENCE=${AUTH_AUDIENCE:-manual-rag-client}
      - AUTH_ACCESS_TTL=${AUTH_ACCESS_TTL:-15m}
      - AUTH_REFRESH_TTL=${AUTH_REFRESH_TTL:-168h}
      - AUTH_ADMIN_USERNAME=${AUTH_ADMIN_USERNAME:?AUTH_ADMIN_USERNAME must be set}
      - AUTH_ADMIN_PASSWORD_HASH=${AUTH_ADMIN_PASSWORD_HASH:?AUTH_ADMIN_PASSWORD_HASH must be set}
      - AUTH_ADMIN_ROLES=${AUTH_ADMIN_ROLES:-admin}
      - WORKER_LIMIT=${WORKER_LIMIT:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Permite resolver host.docker.internal hacia tu máquina host en Linux/WSL2
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      - rag-engine
    restart: unless-stopped

volumes:
  huggingface_cache: