services:
  redis:
    image: redis:7.4-alpine
    container_name: rag_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-manuals}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 1. Base de datos vectorial
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/local/qdrant:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "test -f /qdrant/storage/raft_state.json"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Microservicio Motor RAG (Python)
  rag-engine:
    build:
      context: ./services/retrieval-python
      dockerfile: Dockerfile
    container_name: rag_engine
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/app/.cache/huggingface  # Redirige la caché de HuggingFace
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OMP_NUM_THREADS=2      # Limita hilos de CPU para no saturar los 4 núcleos
      - MKL_NUM_THREADS=2
      - OTEL_SERVICE_NAME=rag-engine
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - QDRANT_TIMEOUT_SECONDS=${QDRANT_TIMEOUT_SECONDS:-5}
      - QDRANT_RETRY_ATTEMPTS=${QDRANT_RETRY_ATTEMPTS:-2}
      - QDRANT_RETRY_BACKOFF_SECONDS=${QDRANT_RETRY_BACKOFF_SECONDS:-0.2}
    volumes:
      - huggingface_cache:/app/.cache/huggingface  # Guarda el modelo en el volumen
      - ./data/documents:/app/documents
      - ./data/artifacts:/app/output
    deploy:
      resources:
        limits:
          memory: 2.5g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  ingestion-api:
    build:
      context: ./services/retrieval-python
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - INGESTION_REDIS_URL=redis://redis:6379/2
      - INGESTION_REDIS_PREFIX=${INGESTION_REDIS_PREFIX:-manual-rag:ingestion}
      - INGESTION_QUEUE=${INGESTION_QUEUE:-ingestion}
      - INGESTION_LOCAL_ROOT=/app/documents/new
      - INGESTION_WORKSPACE_ROOT=/tmp/manual-rag/jobs
      - INGESTION_SCRIPTS_DIR=/app/scripts
      - INGESTION_JOB_TIMEOUT_SECONDS=${INGESTION_JOB_TIMEOUT_SECONDS:-900}
      - INGESTION_PIPELINE_TIMEOUT_SECONDS=${INGESTION_PIPELINE_TIMEOUT_SECONDS:-900}
      - INGESTION_MAX_RETRIES=${INGESTION_MAX_RETRIES:-3}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-manuals}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - MINIO_BUCKET=${MINIO_BUCKET:-manuals}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data/documents:/app/documents
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingestion-worker:
    build:
      context: ./services/retrieval-python
      dockerfile: Dockerfile
    command: ["python", "-m", "manual_rag.entrypoints.worker"]
    environment:
      - INGESTION_REDIS_URL=redis://redis:6379/2
      - INGESTION_REDIS_PREFIX=${INGESTION_REDIS_PREFIX:-manual-rag:ingestion}
      - INGESTION_QUEUE=${INGESTION_QUEUE:-ingestion}
      - INGESTION_LOCAL_ROOT=/app/documents/new
      - INGESTION_WORKSPACE_ROOT=/tmp/manual-rag/jobs
      - INGESTION_SCRIPTS_DIR=/app/scripts
      - INGESTION_JOB_TIMEOUT_SECONDS=${INGESTION_JOB_TIMEOUT_SECONDS:-900}
      - INGESTION_PIPELINE_TIMEOUT_SECONDS=${INGESTION_PIPELINE_TIMEOUT_SECONDS:-900}
      - INGESTION_MAX_RETRIES=${INGESTION_MAX_RETRIES:-3}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-manuals}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - MINIO_BUCKET=${MINIO_BUCKET:-manuals}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    volumes:
      - ./data/documents:/app/documents
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2.5g
    restart: unless-stopped

  # 2b. Servidor MCP para GitHub Copilot / clientes MCP
  mcp-server:
    build:
      context: ./services/retrieval-python
      dockerfile: Dockerfile
    container_name: rag_mcp_server
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "8001:8001"
    environment:
      - HF_HOME=/app/.cache/huggingface
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DEFAULT_COLLECTION=generic_manuals
      - MCP_DOMAIN_COLLECTIONS={"technical_manuals":"manuales_tecnicos"}
      - MCP_PORT=8001
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OTEL_SERVICE_NAME=mcp-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    volumes:
      - huggingface_cache:/app/.cache/huggingface
      - ./data/documents:/app/documents
      - ./data/artifacts:/app/output
    deploy:
      resources:
        limits:
          memory: 2.5g
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  # 3. API Gateway en Go
  api-go:
    build:
      context: ./services/gateway-go
      dockerfile: Dockerfile
    container_name: rag_go_api
    ports:
      - "8080:8080"
    environment:
      - PYTHON_ENGINE_URL=http://rag-engine:8000
      - INGESTION_API_URL=http://ingestion-api:8000
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
      - AUTH_REFRESH_SECRET=${AUTH_REFRESH_SECRET:?AUTH_REFRESH_SECRET must be set}
      - AUTH_ISSUER=${AUTH_ISSUER:-manual-rag-api}
      - AUTH_AUDIENCE=${AUTH_AUDIENCE:-manual-rag-client}
      - AUTH_ACCESS_TTL=${AUTH_ACCESS_TTL:-15m}
      - AUTH_REFRESH_TTL=${AUTH_REFRESH_TTL:-168h}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - AUTH_SESSION_REDIS_URL=${AUTH_SESSION_REDIS_URL:-redis://redis:6379/0}
      - AUTH_ADMIN_USERNAME=${AUTH_ADMIN_USERNAME:?AUTH_ADMIN_USERNAME must be set}
      - AUTH_ADMIN_PASSWORD_HASH=${AUTH_ADMIN_PASSWORD_HASH:?AUTH_ADMIN_PASSWORD_HASH must be set}
      - AUTH_ADMIN_ROLES=${AUTH_ADMIN_ROLES:-admin}
      - WORKER_LIMIT=${WORKER_LIMIT:-2}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-1m}
      - HTTP_CLIENT_TIMEOUT=${HTTP_CLIENT_TIMEOUT:-5m}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-5m}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-1048576}
      - READINESS_INTERVAL=${READINESS_INTERVAL:-15s}
      - SHUTDOWN_TIMEOUT=${SHUTDOWN_TIMEOUT:-15s}
      - DEPENDENCY_RETRY_ATTEMPTS=${DEPENDENCY_RETRY_ATTEMPTS:-2}
      - DEPENDENCY_RETRY_BACKOFF=${DEPENDENCY_RETRY_BACKOFF:-200ms}
      - CIRCUIT_BREAKER_FAILURES=${CIRCUIT_BREAKER_FAILURES:-5}
      - CIRCUIT_BREAKER_RESET=${CIRCUIT_BREAKER_RESET:-30s}
      - OTEL_SERVICE_NAME=api-go
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    extra_hosts:
      - "host.docker.internal:host-gateway" # Permite resolver host.docker.internal hacia tu máquina host en Linux/WSL2
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      rag-engine:
        condition: service_healthy
      ingestion-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 20s

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: rag_frontend
    ports:
      - "5173:8080"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - api-go
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rag_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    depends_on:
      - api-go
      - rag-engine
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: rag_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: rag_loki
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: rag_promtail
    volumes:
      - ./deploy/observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: rag_tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/observability/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped

volumes:
  huggingface_cache:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  promtail_positions:
  redis_data:
  minio_data:
